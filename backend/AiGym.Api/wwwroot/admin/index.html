<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI GYM Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d7dce2;
      --brand: #6d3df7;
      --danger: #d92d20;
      --ok: #039855;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: space-between;
      min-height: 58px;
      padding: 0 24px;
      background: #14213d;
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 18px auto 40px;
    }

    .toolbar,
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      padding: 14px;
      align-items: end;
    }

    .panel {
      margin-top: 16px;
      overflow: hidden;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      background: #fff;
      color: var(--ink);
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      background: var(--brand);
      color: #fff;
      white-space: nowrap;
    }

    button.secondary {
      background: #eef2f6;
      color: var(--ink);
    }

    button.danger {
      background: var(--danger);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }

    .content {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .form {
      padding: 16px;
    }

    .form h2,
    .table-head h2 {
      margin: 0 0 14px;
      font-size: 17px;
    }

    .field {
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .table-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: #fafbfc;
    }

    td:last-child,
    th:last-child {
      width: 150px;
      text-align: right;
    }

    .tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ede7ff;
      color: #5529d6;
      font-size: 12px;
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 820px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        padding: 14px 16px;
      }

      .toolbar,
      .content {
        grid-template-columns: 1fr;
      }

      main {
        width: min(100% - 20px, 1180px);
      }

      table,
      thead,
      tbody,
      tr,
      th,
      td {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        border-bottom: 1px solid var(--line);
      }

      td {
        border: 0;
      }

      td:last-child {
        width: auto;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>AI GYM Admin</h1>
    <div id="session" class="status">Chua dang nhap</div>
  </header>

  <main>
    <section class="toolbar" aria-label="Dang nhap admin">
      <div>
        <label for="email">Email admin</label>
        <input id="email" autocomplete="username" value="admin123@gmail.com">
      </div>
      <div>
        <label for="password">Mat khau</label>
        <input id="password" type="password" autocomplete="current-password" value="123123123Az!">
      </div>
      <button id="login" type="button">Dang nhap</button>
    </section>

    <div class="content">
      <section class="panel form" aria-label="Quan ly bai viet">
        <h2 id="form-title">Them bai viet</h2>
        <input id="post-id" type="hidden">
        <div class="field">
          <label for="content">Noi dung</label>
          <textarea id="content" placeholder="Nhap noi dung bai viet"></textarea>
        </div>
        <div class="field">
          <label for="tag">Nhan</label>
          <input id="tag" value="Bai viet">
        </div>
        <div class="actions">
          <button type="button" data-action="create-post" id="save-post">Luu bai viet</button>
          <button type="button" class="secondary" id="reset-form">Lam moi</button>
        </div>
        <p id="message" class="status"></p>
      </section>

      <section class="panel" aria-label="Danh sach bai viet">
        <div class="table-head">
          <h2>Danh sach bai viet</h2>
          <button type="button" class="secondary" id="refresh">Tai lai</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Tac gia</th>
              <th>Noi dung</th>
              <th>Nhan</th>
              <th>Thao tac</th>
            </tr>
          </thead>
          <tbody id="posts">
            <tr>
              <td colspan="5" class="empty">Dang tai...</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <script>
    const api = {
      token: localStorage.getItem('aigym_admin_token') || '',
      headers(auth) {
        const headers = { 'Content-Type': 'application/json' };
        if (auth && api.token) headers.Authorization = `Bearer ${api.token}`;
        return headers;
      },
      async request(path, options = {}) {
        const response = await fetch(path, options);
        if (!response.ok) {
          let message = `Yeu cau that bai (${response.status})`;
          try {
            const body = await response.json();
            if (body.message) message = body.message;
            if (Array.isArray(body.errors)) message = body.errors.join(', ');
          } catch (_) {}
          throw new Error(message);
        }
        if (response.status === 204) return null;
        return response.json();
      }
    };

    const el = {
      email: document.getElementById('email'),
      password: document.getElementById('password'),
      login: document.getElementById('login'),
      session: document.getElementById('session'),
      id: document.getElementById('post-id'),
      title: document.getElementById('form-title'),
      content: document.getElementById('content'),
      tag: document.getElementById('tag'),
      save: document.getElementById('save-post'),
      reset: document.getElementById('reset-form'),
      refresh: document.getElementById('refresh'),
      posts: document.getElementById('posts'),
      message: document.getElementById('message')
    };

    function setMessage(text, type = '') {
      el.message.textContent = text;
      el.message.className = `status ${type}`;
    }

    function setSession(text, type = '') {
      el.session.textContent = text;
      el.session.className = `status ${type}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function resetForm() {
      el.id.value = '';
      el.title.textContent = 'Them bai viet';
      el.content.value = '';
      el.tag.value = 'Bai viet';
      el.save.dataset.action = 'create-post';
      el.save.textContent = 'Luu bai viet';
      setMessage('');
    }

    async function login() {
      el.login.disabled = true;
      try {
        const auth = await api.request('/api/auth/login', {
          method: 'POST',
          headers: api.headers(false),
          body: JSON.stringify({
            email: el.email.value.trim(),
            password: el.password.value
          })
        });

        if (auth.role !== 'Admin') {
          throw new Error('Tai khoan nay khong co quyen Admin.');
        }

        api.token = auth.token;
        localStorage.setItem('aigym_admin_token', auth.token);
        setSession(`Admin: ${auth.email}`, 'ok');
        setMessage('Dang nhap thanh cong.', 'ok');
        await loadPosts();
      } catch (error) {
        setSession('Dang nhap that bai', 'error');
        setMessage(error.message, 'error');
      } finally {
        el.login.disabled = false;
      }
    }

    async function loadPosts() {
      try {
        const posts = await api.request('/api/posts', {
          headers: api.headers(true)
        });
        if (!posts.length) {
          el.posts.innerHTML = '<tr><td colspan="5" class="empty">Chua co bai viet</td></tr>';
          return;
        }

        el.posts.innerHTML = posts.map(post => `
          <tr>
            <td>#${post.id}</td>
            <td>
              ${escapeHtml(post.authorName)}
              <div class="muted">${new Date(post.createdAt).toLocaleString()}</div>
            </td>
            <td>${escapeHtml(post.content)}</td>
            <td><span class="tag">${escapeHtml(post.tag)}</span></td>
            <td>
              <button type="button" class="secondary" data-action="edit-post" data-id="${post.id}">Sua</button>
              <button type="button" class="danger" data-action="delete-post" data-id="${post.id}">Xoa</button>
            </td>
          </tr>
        `).join('');
      } catch (error) {
        el.posts.innerHTML = `<tr><td colspan="5" class="empty">${escapeHtml(error.message)}</td></tr>`;
      }
    }

    async function savePost() {
      const content = el.content.value.trim();
      if (!content) {
        setMessage('Nhap noi dung bai viet truoc khi luu.', 'error');
        return;
      }

      try {
        const editing = Boolean(el.id.value);
        await api.request(editing ? `/api/posts/${el.id.value}` : '/api/posts', {
          method: editing ? 'PUT' : 'POST',
          headers: api.headers(true),
          body: JSON.stringify({
            content,
            tag: el.tag.value.trim() || 'Bai viet'
          })
        });
        setMessage(editing ? 'Da cap nhat bai viet.' : 'Da them bai viet.', 'ok');
        resetForm();
        await loadPosts();
      } catch (error) {
        setMessage(error.message, 'error');
      }
    }

    async function editPost(id) {
      const posts = await api.request('/api/posts', {
        headers: api.headers(true)
      });
      const post = posts.find(item => String(item.id) === String(id));
      if (!post) return;
      el.id.value = post.id;
      el.title.textContent = `Sua bai viet #${post.id}`;
      el.content.value = post.content;
      el.tag.value = post.tag;
      el.save.dataset.action = 'update-post';
      el.save.textContent = 'Cap nhat';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deletePost(id) {
      if (!confirm(`Xoa bai viet #${id}?`)) return;
      try {
        await api.request(`/api/posts/${id}`, {
          method: 'DELETE',
          headers: api.headers(true)
        });
        setMessage('Da xoa bai viet.', 'ok');
        await loadPosts();
      } catch (error) {
        setMessage(error.message, 'error');
      }
    }

    el.login.addEventListener('click', login);
    el.save.addEventListener('click', savePost);
    el.reset.addEventListener('click', resetForm);
    el.refresh.addEventListener('click', loadPosts);
    el.posts.addEventListener('click', event => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;
      if (button.dataset.action === 'edit-post') editPost(button.dataset.id);
      if (button.dataset.action === 'delete-post') deletePost(button.dataset.id);
    });

    if (api.token) {
      setSession('Da co token admin tren trinh duyet', 'ok');
    }
    loadPosts();
  </script>
</body>
</html>
