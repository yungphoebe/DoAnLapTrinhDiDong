name: ai_gym
description: "Giao diện AI GYM bằng Flutter theo thiết kế tham chiếu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.2
  flutter_timezone: 5.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  shared_preferences: ^2.2.3
  timezone: 0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
