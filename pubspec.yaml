name: ai_gym
description: "Giao diện AI GYM bằng Flutter theo thiết kế tham chiếu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  camera: ^0.12.1
  camera_windows: ^0.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.2
  flutter_timezone: 5.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  package_info_plus: ^10.2.2
  shared_preferences: ^2.2.3
  timezone: 0.11.0
  flutter_tts: ^4.2.5
  health: ^13.2.1
  http: ^1.6.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  speech_to_text: ^7.5.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.15.0
  mocktail: ^1.0.5
  mockito: ^5.8.1
  device_info_plus: ^13.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
